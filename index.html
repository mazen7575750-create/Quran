<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصحف التلاوة الذكي - بالذكاء الاصطناعي</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h2 {
            color: #1b4d3e;
            margin-bottom: 10px;
        }
        .ayah-box {
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 20px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            color: #117a65;
            margin: 20px 0;
        }
        .btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn.recording {
            background: #e74c3c;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 20px;
            text-align: right;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مصحف التلاوة الذكي (مشروع تجريبي)</h2>
        <p>قم بتلاوة الآية التالية بدقة:</p>
        
        <div class="ayah-box" id="targetAyah">
            بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
        </div>

        <button id="recordBtn" class="btn" onclick="toggleRecording()">🎤 ابدأ التلاوة</button>

        <div class="result-box">
            <p><strong>ما تم رصده:</strong> <span id="transcript">لم يتم بدء التسجيل بعد...</span></p>
            <div class="feedback" id="feedback">جاهز للاستماع...</div>
        </div>
    </div>

    <script>
        const OPENAI_API_KEY = "Sk-proj-3br8x-uiM1NUiHzeX_NAGYS0YpqtMbadNFJ_ZvO5h42seAmwCFj805iphj5UnQHvGGFo3V2E7PT3BlbkFJnBFSHTRZi1RCM23B3seCw4raV2W43vD0A2XlSTQNnGNq5_JBRYaBfqb31saePfozFpBnUQzA8A";
        
        let isRecording = false;
        let recognition;

        const targetAyahText = "بسم الله الرحمن الرحيم";

        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const feedbackEl = document.getElementById('feedback');
            const transcriptEl = document.getElementById('transcript');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم التعرف الصوتي المباشر، يُرجى استخدام متصفح Google Chrome.");
                return;
            }

            if (!isRecording) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.continuous = false;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isRecording = true;
                    btn.textContent = "🛑 إيقاف التلاوة";
                    btn.classList.add('recording');
                    feedbackEl.textContent = "جاري الاستماع لتلاوتك...";
                    feedbackEl.style.color = "#d35400";
                };

                recognition.onresult = (event) => {
                    let interimTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        interimTranscript += event.results[i][0].transcript;
                    }
                    transcriptEl.textContent = interimTranscript;
                    
                    if (interimTranscript.trim().length > 0) {
                        if (targetAyahText.includes(interimTranscript.trim()) || interimTranscript.trim().includes("بسم الله")) {
                            feedbackEl.textContent = "✅ تلاوة صحيحة وموفقة!";
                            feedbackEl.style.color = "#27ae60";
                        } else {
                            feedbackEl.textContent = "⚠️ تنبيه: يُرجى التأكد من صحة نطق الكلمات.";
                            feedbackEl.style.color = "#c0392b";
                        }
                    }
                };

                recognition.onerror = (event) => {
                    console.error(event.error);
                    feedbackEl.textContent = "حدث خطأ أثناء التقاط الصوت.";
                    stopRecordingState();
                };

                recognition.onend = () => {
                    stopRecordingState();
                };

                recognition.start();
            } else {
                if (recognition) {
                    recognition.stop();
                }
                stopRecordingState();
            }
        }

        function stopRecordingState() {
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.textContent = "🎤 ابدأ التلاوة";
            btn.classList.remove('recording');
        }
    </script>
</body>
</html>
