<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصحف التلاوة الذكي - على نمط رتيل</title>
    <style>
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f7f9fc;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }
        h2 {
            color: #1b4d3e;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .mode-card {
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            color: #117a65;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 18px;
            border-radius: 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        .btn.recording {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        .btn:hover {
            opacity: 0.95;
        }
        .result-box {
            margin-top: 25px;
            text-align: right;
            background: #fdfefe;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }
        .result-title {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }
        .transcript-text {
            font-size: 22px;
            font-weight: bold;
            color: #2c3e50;
            min-height: 50px;
            line-height: 1.6;
        }
        .status-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            background: #f1f2f6;
            color: #57606f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>مصحف التلاوة الذكي</h2>
        <p class="subtitle">تلاوة حرة بالذكاء الاصطناعي (على نمط رتيل)</p>
        
        <div class="mode-card">
            📖 وضع التلاوة الحرة: اقرأ أي آية من القرآن الكريم وسيقوم النظام بالاستماع والتعرف عليها تلقائياً.
        </div>

        <button id="recordBtn" class="btn" onclick="toggleRecording()">🎤 ابدأ الاستماع للتلاوة</button>

        <div class="result-box">
            <div class="result-title">ما تم رصده من تلاوتك:</div>
            <div class="transcript-text" id="transcript">اضغط على زر ابدأ وتلوا ما شئت...</div>
            <div id="statusBadge" class="status-badge">جاهز للاستماع</div>
        </div>
    </div>

    <script>
        const OPENAI_API_KEY = "Sk-proj-3br8x-uiM1NUiHzeX_NAGYS0YpqtMbadNFJ_ZvO5h42seAmwCFj805iphj5UnQHvGGFo3V2E7PT3BlbkFJnBFSHTRZi1RCM23B3seCw4raV2W43vD0A2XlSTQNnGNq5_JBRYaBfqb31saePfozFpBnUQzA8A";
        
        let isRecording = false;
        let recognition;

        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const statusBadge = document.getElementById('statusBadge');
            const transcriptEl = document.getElementById('transcript');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("متصفحك لا يدعم التعرف الصوتي المباشر، يُرجى استخدام متصفح Google Chrome الحديث.");
                return;
            }

            if (!isRecording) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ar-SA';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isRecording = true;
                    btn.textContent = "🛑 إيقاف الاستماع";
                    btn.classList.add('recording');
                    statusBadge.textContent = "🎙️ جاري الاستماع لتلاوتك... اقرأ الآن";
                    statusBadge.style.background = "#fef5e7";
                    statusBadge.style.color = "#d35400";
                };

                recognition.onresult = (event) => {
                    let fullTranscript = '';
                    for (let i = 0; i < event.results.length; ++i) {
                        fullTranscript += event.results[i][0].transcript;
                    }
                    transcriptEl.textContent = fullTranscript;
                    
                    if (fullTranscript.trim().length > 0) {
                        statusBadge.textContent = "✅ تم التقاط التلاوة بنجاح";
                        statusBadge.style.background = "#e8f8f5";
                        statusBadge.style.color = "#117a65";
                    }
                };

                recognition.onerror = (event) => {
                    console.error(event.error);
                    statusBadge.textContent = "⚠️ حدث خطأ في التقاط الصوت، حاول مرة أخرى.";
                    statusBadge.style.background = "#fdebd0";
                    statusBadge.style.color = "#c0392b";
                    stopRecordingState();
                };

                recognition.onend = () => {
                    if (isRecording) {
                        try { recognition.start(); } catch(e) {}
                    }
                };

                recognition.start();
            } else {
                isRecording = false;
                if (recognition) {
                    recognition.stop();
                }
                stopRecordingState();
            }
        }

        function stopRecordingState() {
            isRecording = false;
            const btn = document.getElementById('recordBtn');
            btn.textContent = "🎤 ابدأ الاستماع للتلاوة";
            btn.classList.remove('recording');
            const statusBadge = document.getElementById('statusBadge');
            statusBadge.textContent = "تم إيقاف التلاوة";
            statusBadge.style.background = "#f1f2f6";
            statusBadge.style.color = "#57606f";
        }
    </script>
</body>
</html>
